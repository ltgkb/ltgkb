name: Daily Update README

on:
  # 允许在 Actions 页面手动触发 (方便测试)
  workflow_dispatch:
  # 每天 UTC 时间 0点 (北京时间早上8点) 自动触发
  schedule:
    - cron: '0 0 * * *'
        
jobs: 
  update-readme:    
    runs-on: ubuntu-latest
    # 必须赋予写入权限，否则无法提交修改
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3   
   
      - name: Update Date in README
        run: |
          # 1. 获取当前时间 (UTC) 
          # 你也可以加 8 小时换算成北京时间：NOW=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
          NOW=$(date "+%Y-%m-%d %H:%M:%S")
          
          # 2. 定义要写入的内容
          CONTENT="最后更新时间: $NOW"
          
          # 3. 使用 perl 正则表达式替换 START_DATE 和 END_DATE 之间的内容 (这里去掉了前面的 #)
         perl -0777 -pi -e "s/()(.*?)()/\$1\n$CONTENT\n\$3/s" README.md
      - name: Commit and Push
        run: |
          # 配置 git 用户信息（显示为 GitHub Action 机器人）
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 检查是否有文件变动
          if [[ -n $(git status -s) ]]; then
            git add README.md
            git commit -m "Auto update README time"
            git push
            echo "✅ README updated successfully."
          else
            echo "⚠️ No changes to commit."
          fi
